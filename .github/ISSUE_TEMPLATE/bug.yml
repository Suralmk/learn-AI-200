name: Bug
description: Something on the site does not work
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and what happened
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and theme (light or dark)
